<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0077ff">
  <meta name="color-scheme" content="light dark">
  
  <title>Homework Book | Calendar</title>

  <link rel="stylesheet" href="event.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
  
  <!-- Critical CSS for theme -->
  <style>
    :root { color-scheme: light dark; }
    html, body { 
      margin: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #fdfdfd;
      min-height: 100vh;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0f0f0f; }
    }
    html[data-theme="dark"], html[data-theme="dark"] body { background-color: #0f0f0f !important; }
    html[data-theme="light"], html[data-theme="light"] body { background-color: #fdfdfd !important; }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <style>
    .auth-gate{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:1rem;background:rgba(15,23,42,.78)}.auth-card{width:min(100%,380px);padding:1.5rem;border-radius:18px;background:#fff;color:#172033;box-shadow:0 20px 70px rgba(0,0,0,.35)}.auth-card h1{margin:0 0 .5rem;font-size:1.5rem}.auth-card p{color:#536176}.auth-card input{box-sizing:border-box;width:100%;margin:.35rem 0;padding:.8rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem}.auth-card button{min-height:42px;border:0;border-radius:8px;padding:.7rem;font:inherit;font-weight:700;cursor:pointer;background:#0077ff;color:#fff}.auth-card .auth-secondary{background:#e8eef7;color:#172033}.auth-card .auth-google{width:100%;margin-top:.7rem;background:#fff;color:#172033;border:1px solid #cbd5e1}.auth-message{min-height:1.3rem;font-size:.9rem}.auth-message.error{color:#dc2626}.header-actions{position:relative}.account-btn{display:inline-flex;align-items:center;gap:.45rem;min-height:40px;max-width:190px;padding:.45rem .65rem;border:0;border-radius:10px;background:transparent;color:inherit;cursor:pointer;font:inherit}.account-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem}.account-menu{position:absolute;top:calc(100% + .55rem);right:0;z-index:1001;width:min(280px,calc(100vw - 2rem));padding:.85rem;border:1px solid rgba(127,127,127,.25);border-radius:12px;background:#fff;color:#172033;box-shadow:0 12px 30px rgba(0,0,0,.18)}.account-menu p{margin:0 0 .7rem;overflow-wrap:anywhere;font-size:.9rem}.account-menu button{width:100%;border:0;border-radius:8px;padding:.65rem;background:#dc2626;color:#fff;font:inherit;font-weight:700;cursor:pointer}@media(max-width:560px){.account-label{display:none}.account-btn{max-width:none}}@media(prefers-color-scheme:dark){.auth-card,.account-menu{background:#182235;color:#f8fafc}.auth-card p{color:#cbd5e1}.auth-card input{background:#0f172a;color:#fff;border-color:#475569}.auth-card .auth-secondary{background:#334155;color:#fff}.auth-card .auth-google{background:#182235;color:#fff;border-color:#475569}}
  </style>
  <section id="auth-gate" class="auth-gate" aria-labelledby="auth-title"><div class="auth-card"><h1 id="auth-title">Sign in to Homework Book</h1><p>Sign in on both your phone and computer to keep your homework in sync.</p><input id="auth-email" type="email" autocomplete="email" placeholder="Email address"><input id="auth-password" type="password" autocomplete="current-password" placeholder="Password"><div class="auth-actions"><button id="email-sign-in" type="button">Sign in</button><button id="email-sign-up" class="auth-secondary" type="button">Create account</button></div><button id="google-sign-in" class="auth-google" type="button">Continue with Google</button><p id="auth-message" class="auth-message" aria-live="polite"></p></div></section>
  <header class="app-header">
    <div class="header-left">
      <button id="back-btn" class="icon-btn" aria-label="Back to main page">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h1 data-i18n="calendar">Calendar</h1>
    </div>
    
    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn theme-flip-btn" aria-label="Toggle dark mode">
  <i class="fa-solid fa-circle-half-stroke"></i>
</button>
      <button id="account-toggle" class="account-btn" aria-expanded="false" aria-controls="account-menu"><i class="fa-solid fa-user-circle"></i><span id="account-button-label" class="account-label">Account</span></button>
      <div id="account-menu" class="account-menu hidden" role="menu"><p id="account-name">Signed in</p><button id="sign-out" type="button" role="menuitem">Sign out</button></div>
    </div>
  </header>

  <main class="calendar-container">
    <div class="calendar-wrapper">
      <div class="calendar-header">
        <button id="prev-month" class="nav-btn" aria-label="Previous month">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h2 id="calendar-title"></h2>
        <button id="next-month" class="nav-btn" aria-label="Next month">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <div class="calendar-weekdays">
        <div data-i18n="sun">Sun</div>
        <div data-i18n="mon">Mon</div>
        <div data-i18n="tue">Tue</div>
        <div data-i18n="wed">Wed</div>
        <div data-i18n="thu">Thu</div>
        <div data-i18n="fri">Fri</div>
        <div data-i18n="sat">Sat</div>
      </div>

      <div id="calendar-grid" class="calendar-grid"></div>
    </div>

    <!-- Selected Date Events -->
    <div id="selected-date-panel" class="selected-date-panel hidden">
      <div class="panel-header">
        <h3 id="selected-date-title"></h3>
        <button id="close-panel" class="icon-btn">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div id="events-list" class="events-list">
        <p class="empty-state" data-i18n="noEvents">No events for this date</p>
      </div>
      
      <form id="event-form" class="event-form">
        <input 
          type="text" 
          id="event-title" 
          data-i18n-placeholder="eventTitle"
          placeholder="Event title" 
          required 
        />
        <div class="form-actions">
          <button type="submit" class="btn-primary" data-i18n="saveEvent">Save Event</button>
          <button type="button" id="cancel-event" class="btn-secondary" data-i18n="cancel">Cancel</button>
        </div>
      </form>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>
  
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js" defer></script>
  <script src="firebase-sync.js" defer></script>
  <script src="event.js" defer></script>
</body>
</html>
