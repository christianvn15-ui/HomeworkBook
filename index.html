<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0077ff">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A modern PWA for managing homework and calendar events">

  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Homework Book">

  <title>Homework Book</title>

  <!-- Preload Critical Resources -->
  <link rel="preload" href="style.css" as="style">
  <link rel="preload" href="app.js" as="script">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <!-- Font Awesome with display=swap -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" media="print" onload="this.media='all'">

  <!-- Critical CSS Inline -->
  <style>
    /* Critical rendering path styles */
    :root {
      color-scheme: light dark;
    }
    html, body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #fdfdfd;
      min-height: 100vh;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #0f0f0f;
      }
    }
    html[data-theme="dark"], html[data-theme="dark"] body {
      background-color: #0f0f0f !important;
    }
    html[data-theme="light"], html[data-theme="light"] body {
      background-color: #fdfdfd !important;
    }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <style>
    .auth-gate{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:1rem;background:rgba(15,23,42,.78)}.auth-card{width:min(100%,380px);padding:1.5rem;border-radius:18px;background:#fff;color:#172033;box-shadow:0 20px 70px rgba(0,0,0,.35)}.auth-card h1{margin:0 0 .5rem;font-size:1.5rem}.auth-card p{color:#536176}.auth-card input{box-sizing:border-box;width:100%;margin:.35rem 0;padding:.8rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem}.auth-card button{min-height:42px;border:0;border-radius:8px;padding:.7rem;font:inherit;font-weight:700;cursor:pointer;background:#0077ff;color:#fff}.auth-card .auth-secondary{background:#e8eef7;color:#172033}.auth-card .auth-google{width:100%;margin-top:.7rem;background:#fff;color:#172033;border:1px solid #cbd5e1}.auth-message{min-height:1.3rem;font-size:.9rem}.auth-message.error{color:#dc2626}.auth-locked{pointer-events:none;user-select:none}.header-actions{position:relative}.account-btn{display:inline-flex;align-items:center;gap:.45rem;min-height:40px;max-width:190px;padding:.45rem .65rem;border:0;border-radius:10px;background:transparent;color:inherit;cursor:pointer;font:inherit}.account-btn:hover{background:rgba(127,127,127,.14)}.account-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem}.account-menu{position:absolute;top:calc(100% + .55rem);right:0;z-index:1001;width:min(280px,calc(100vw - 2rem));padding:.85rem;border:1px solid rgba(127,127,127,.25);border-radius:12px;background:#fff;color:#172033;box-shadow:0 12px 30px rgba(0,0,0,.18)}.account-menu p{margin:0 0 .7rem;overflow-wrap:anywhere;font-size:.9rem}.account-menu button{width:100%;border:0;border-radius:8px;padding:.65rem;background:#dc2626;color:#fff;font:inherit;font-weight:700;cursor:pointer}@media(max-width:560px){.account-label{display:none}.account-btn{max-width:none}}@media(prefers-color-scheme:dark){.auth-card,.account-menu{background:#182235;color:#f8fafc}.auth-card p{color:#cbd5e1}.auth-card input{background:#0f172a;color:#fff;border-color:#475569}.auth-card .auth-secondary{background:#334155;color:#fff}.auth-card .auth-google{background:#182235;color:#fff;border-color:#475569}}
  </style>
  <section id="auth-gate" class="auth-gate" aria-labelledby="auth-title"><div class="auth-card"><h1 id="auth-title">Sign in to Homework Book</h1><p>Sign in on both your phone and computer to keep your homework in sync.</p><input id="auth-email" type="email" autocomplete="email" placeholder="Email address"><input id="auth-password" type="password" autocomplete="current-password" placeholder="Password"><div class="auth-actions"><button id="email-sign-in" type="button">Sign in</button><button id="email-sign-up" class="auth-secondary" type="button">Create account</button></div><button id="google-sign-in" class="auth-google" type="button">Continue with Google</button><p id="auth-message" class="auth-message" aria-live="polite"></p></div></section>
  <!-- App Shell -->
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <div id="date-display" class="date-badge">
          <span class="weekday">Loading...</span>
          <span class="date">...</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="settings-toggle" class="icon-btn" aria-label="Open saved notes history">
          <i class="fa-solid fa-clock-rotate-left"></i>
        </button>
        <button id="calendar-toggle" class="icon-btn" aria-label="Open calendar">
          <i class="fa-solid fa-calendar-days"></i>
        </button>
        <button id="theme-toggle" class="icon-btn theme-flip-btn" aria-label="Toggle dark mode">
          <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
        <button id="language-toggle" class="icon-btn" aria-label="Change language">
            <i class="fa-solid fa-globe"></i>
          </button>
        <button id="account-toggle" class="account-btn" aria-expanded="false" aria-controls="account-menu"><i class="fa-solid fa-user-circle"></i><span id="account-button-label" class="account-label">Account</span></button>
        <div id="account-menu" class="account-menu hidden" role="menu"><p id="account-name">Signed in</p><button id="sign-out" type="button" role="menuitem">Sign out</button></div>

        <button id="install-btn" class="install-btn hidden" aria-label="Install app">
          <i class="fa-solid fa-download"></i>
          <span>Install</span>
        </button>
      </div>
    </header>

<!-- Upcoming Event Reminders -->
<div id="event-reminders" class="event-reminders-bar hidden" aria-live="polite">
  <div class="reminders-content">
    <!-- Reminders injected by JS -->
  </div>
</div>

    <main class="main-content">
      <!-- Notepad Section -->
      <section id="notepad" class="notepad-section">
        <div class="section-header">
          <h1>Homework Notes</h1>
          <span class="subject-counter">0/7 subjects</span>
        </div>

        <div id="subjects-container" class="subjects-grid">
          <!-- Subject blocks generated by JS -->
        </div>

        <!-- Listed Tasks Section -->
        <div class="listed-tasks-section">
          <div class="section-header">
            <h2><i class="fa-solid fa-list-check"></i> Listed Tasks</h2>
            <span class="task-counter">0 tasks</span>
          </div>
          <div id="listed-tasks-container" class="listed-tasks-container">
            <!-- Listed tasks generated by JS -->
          </div>
          <button id="add-listed-task" class="btn-secondary add-task-btn">
            <i class="fa-solid fa-plus"></i> Add Task
          </button>
        </div>

        <button id="add-subject" class="fab-btn" aria-label="Add new subject">
          <i class="fa-solid fa-plus"></i>
        </button>
      </section>
    </main>

    <!-- Settings/History Modal -->
    <dialog id="settings-dialog" class="modal settings-modal" aria-labelledby="settings-title">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="settings-title">Notes History</h2>
          <button id="settings-close" class="close-btn" aria-label="Close settings">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="settings-actions">
          <button id="export-data" class="btn-secondary">
            <i class="fa-solid fa-file-export"></i> Export Data
          </button>
          <button id="clear-history" class="btn-danger">
            <i class="fa-solid fa-trash"></i> Clear History
          </button>
        </div>

        <div id="saved-notes" class="notes-history">
          <p class="empty-state">No saved notes yet</p>
        </div>
      </div>
    </dialog>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  </div>

  <!-- Deferred Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js" defer></script>
  <script src="firebase-sync.js" defer></script>
  <script src="app.js" defer></script>

  <script>
    // Service Worker Registration with update handling
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('service-worker.js');

          // Handle updates
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New version available
                showUpdateNotification(newWorker);
              }
            });
          });

          console.log('SW registered:', registration.scope);
        } catch (err) {
          console.error('SW registration failed:', err);
        }
      });
    }

    function showUpdateNotification(worker) {
      const toast = document.createElement('div');
      toast.className = 'toast update-toast';
      toast.innerHTML = `
        <span>New version available!</span>
        <button onclick="location.reload()">Update</button>
      `;
      document.getElementById('toast-container').appendChild(toast);
    }
  </script>
</body>
</html>
